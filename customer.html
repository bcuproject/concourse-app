<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1622">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Concourse – Customer App</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b1622; --panel:#13212f; --panel2:#1a2c3d; --line:#243a50;
  --text:#eef4f9; --muted:#8fa6ba; --sky:#5bc2f0;
  --green:#3ccf8e; --amber:#f5b942; --red:#ff6b6b;
  --r:14px; --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#060d14;color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
input,select{font:inherit;font-size:16px}
#phone{position:relative;height:100vh;height:100dvh;max-width:480px;margin:0 auto;transform:translateZ(0);overflow:hidden;overflow:clip;box-shadow:0 0 60px #0008;background:var(--bg)}
.app{height:100%;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;background:var(--bg);position:relative;padding-bottom:calc(90px + var(--sab))}

/* kitchen (staff) screen */
#kitchen{position:fixed;inset:0;z-index:70;display:none;flex-direction:column;background:#0a0f15;border:1px solid #1f2b38}
#kitchen.on{display:flex}
.khead{padding:calc(14px + var(--sat)) 16px 12px;border-bottom:1px solid #1f2b38;background:#0e151d}
.khead .r1{display:flex;align-items:center;gap:10px}
.khead h2{font-size:24px;text-transform:uppercase;flex:1}
.khead .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.kclose{width:38px;height:38px;border-radius:10px;background:var(--panel);font-size:16px;color:var(--muted)}
.kctl{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.kctl label{flex:1;min-width:150px}
.kstats{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.kbody{flex:1;overflow:auto;padding:12px 12px 30px;display:grid;grid-template-columns:1fr;gap:14px;align-content:start}
.kcol h3{font-family:Inter;font-size:12.5px;letter-spacing:1px;text-transform:uppercase;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.kcol h3 i{width:9px;height:9px;border-radius:50%}
.kcol .cnt{background:#1f2b38;border-radius:99px;padding:1px 8px;font-size:11px;color:var(--muted)}
.kempty{color:#5f7a90;font-size:13px;border:1.5px dashed #1f2b38;border-radius:12px;padding:16px;text-align:center}
.tk{background:#141d27;border:1px solid #223244;border-radius:14px;margin-bottom:10px;overflow:hidden}
.tk .bar{height:5px}
.tk.s0 .bar{background:var(--amber)} .tk.s1 .bar{background:var(--sky)} .tk.s2 .bar{background:var(--green)} .tk.sx .bar{background:#5b7389}
.tk.flash{animation:flash 1s 4}
@keyframes flash{50%{border-color:var(--amber);box-shadow:0 0 0 3px #f5b94255}}
.tkin{padding:10px 12px 12px}
.tkh{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.tkago{text-align:right}
.tkcode{font-family:"Barlow Condensed","Arial Narrow";font-size:30px;font-weight:800;letter-spacing:2px}
.tkago{font-size:12px;color:var(--muted)}
.tks{font-size:12.5px;color:var(--muted);margin-top:-2px}
.tk ul{list-style:none;margin:8px 0;padding:0;font-size:15px}
.tk li{padding:3px 0;border-bottom:1px dashed #223244}
.tk li b{color:var(--amber);margin-right:6px}
.tkbtn{width:100%;border-radius:11px;padding:13px;font-weight:800;font-size:15px;margin-top:8px}
.tkbtn.prep{background:var(--amber);color:#2a1d00}
.tkbtn.ready{background:var(--green);color:#03281a;font-size:16px}
.tkbtn.done{background:#223244;color:var(--text)}
.tklink{display:block;width:100%;text-align:center;color:var(--sky);font-size:12.5px;font-weight:600;padding:8px 0 0}
.auto{font-size:12px;color:var(--sky);margin-top:4px}
.staffbtn{height:40px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-size:12px;font-weight:700;padding:0 10px;color:var(--amber);flex:none}
.khint{font-size:12px;color:var(--muted);background:#121b25;border:1px solid #1f2b38;border-radius:10px;padding:9px 12px;margin-top:10px;line-height:1.45}
@media(min-width:700px){.kbody{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1000px){
  body{display:flex;justify-content:center;gap:24px;padding:24px;height:100vh;box-sizing:border-box;overflow:hidden}
  #phone{width:430px;height:calc(100vh - 48px);margin:0;border-radius:34px;border:7px solid #1c2a38;flex:none}
  #kitchen{display:flex;position:relative;inset:auto;z-index:1;height:calc(100vh - 48px);flex:1;max-width:820px;border-radius:22px;overflow:hidden}
  .kclose,.staffbtn{display:none}
  .khead{padding-top:14px}
}

/* app modes */
.kopen{display:none;color:var(--sky);font-weight:700;font-size:13px;text-decoration:none;border:1px solid var(--line);border-radius:10px;padding:8px 12px}
body[data-mode="kitchen"] .kopen{display:inline-block}
body[data-mode="customer"] #kitchen{display:none!important}
body[data-mode="kitchen"] #phone,body[data-mode="kitchen"] #push{display:none!important}
body[data-mode="kitchen"]{display:block;padding:0;height:auto;overflow:auto}
body[data-mode="kitchen"] #kitchen{display:flex!important;position:relative;inset:auto;z-index:1;min-height:100vh;height:100vh;max-width:none;border-radius:0;border:0}
body[data-mode="kitchen"] .kclose{display:none}
@media(min-width:1000px){body[data-mode="customer"]{display:block}body[data-mode="customer"] #phone{margin:0 auto}}

/* advertising */
.ad{position:relative;border-radius:16px;overflow:hidden;padding:14px 14px 14px 16px;display:flex;gap:14px;align-items:center;text-align:left;width:100%;color:#fff;border:0;margin:0}
.ad::after{content:"";position:absolute;right:-30px;bottom:-40px;width:140px;height:140px;border-radius:50%;background:#ffffff14}
.adlbl{position:absolute;top:8px;right:10px;font-size:9.5px;font-weight:800;background:#0005;border-radius:6px;padding:2px 6px;letter-spacing:.8px;text-transform:uppercase;z-index:1}
.ad .ae{font-size:40px;flex:none;filter:drop-shadow(0 4px 8px #0004);z-index:1}
.ad .ab{font-size:11px;font-weight:700;opacity:.85;text-transform:uppercase;letter-spacing:.8px}
.ad .ah{font-family:"Barlow Condensed","Arial Narrow";font-size:22px;font-weight:800;text-transform:uppercase;line-height:1.02;margin-top:1px}
.ad .as{font-size:12.5px;opacity:.92;margin-top:4px;line-height:1.35}
.ad .ac{margin-top:9px;display:inline-block;background:#fff;color:#111;font-weight:700;font-size:12px;border-radius:99px;padding:5px 12px}
.ad > div{z-index:1;min-width:0}
.ad.slim{padding:11px 14px}.ad.slim .ae{font-size:30px}.ad.slim .ah{font-size:18px}.ad.slim .ac{margin-top:6px}
.carousel{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;scrollbar-width:none;margin:16px -16px 0;padding:0 16px;scroll-padding:0 16px}
.carousel::-webkit-scrollbar{display:none}
.carousel .ad{flex:0 0 100%;scroll-snap-align:start;min-height:128px}
.dots{display:flex;justify-content:center;gap:6px;margin-top:9px}
.dots i{width:6px;height:6px;border-radius:3px;background:#36506a;transition:all .25s}
.dots i.on{width:18px;background:var(--sky)}
.promo{border:1.5px solid #6b5524;background:linear-gradient(120deg,#2a2210,#13212f 70%)}
.promo .t{color:var(--amber)}
.codebox{display:flex;align-items:center;justify-content:space-between;border:2px dashed #5b7389;border-radius:12px;padding:12px 14px;margin-top:14px}
.codebox b{font-family:"Barlow Condensed","Arial Narrow";font-size:28px;letter-spacing:3px}
.stt{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
.stt th{text-align:left;color:var(--muted);font-weight:600;font-size:11.5px;padding:6px 4px;border-bottom:1px solid var(--line)}
.stt td{padding:8px 4px;border-bottom:1px solid var(--line)}
.stt td:not(:first-child),.stt th:not(:first-child){text-align:right}

/* customer push notification */
#push{position:fixed;top:0;left:50%;transform:translate(-50%,-130%);width:min(440px,calc(100% - 20px));z-index:100;background:#eef1f5f2;color:#111;border-radius:20px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start;transition:transform .4s cubic-bezier(.2,.9,.3,1.2);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:0 14px 44px #000a;cursor:pointer;text-align:left}
#push.on{transform:translate(-50%,calc(12px + var(--sat)))}
#push .pi{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,#5bc2f0,#2a7fb8);display:grid;place-items:center;font-family:"Barlow Condensed","Arial Narrow";font-weight:800;color:#04202f;font-size:20px;flex:none}
#push .pt{display:flex;justify-content:space-between;font-size:12px;color:#555;font-weight:600}
#push .pb{font-size:14.5px;font-weight:700;margin-top:1px}
#push .pd{font-size:13.5px;color:#333;margin-top:1px;line-height:1.35}
.ord.ready{border-color:var(--green);box-shadow:0 0 0 0 #3ccf8e66;animation:rpulse 1.8s infinite}
@keyframes rpulse{70%{box-shadow:0 0 0 10px #3ccf8e00}100%{box-shadow:0 0 0 0 #3ccf8e00}}
.readybox{background:#0f2e22;border:1px solid #2a6b50;border-radius:12px;padding:10px 12px;margin-top:10px;font-size:13px;color:#bdf3d9;line-height:1.45}
h1,h2,h3,.cond{font-family:"Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:.3px;margin:0}

/* header */
.top{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#0b1622 85%,#0b162200);padding:calc(12px + var(--sat)) 16px 8px}
.brand{display:flex;align-items:center;gap:10px}
.back{width:40px;height:40px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-size:20px;flex:none}
.brand h1{font-size:26px;font-weight:800;text-transform:uppercase}
.brand h1 span{color:var(--sky)}
.evname{flex:1;min-width:0}
.evname .n{font-family:"Barlow Condensed","Arial Narrow";font-weight:700;font-size:21px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}
.evname .v{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live{margin-top:10px;background:linear-gradient(135deg,#123049,#0f2236);border:1px solid #2a4c6a;border-radius:var(--r);padding:10px 14px;display:flex;align-items:center;gap:12px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--red);flex:none;animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 #ff6b6b99}70%{box-shadow:0 0 0 8px #ff6b6b00}100%{box-shadow:0 0 0 0 #ff6b6b00}}
.ltitle{font-family:"Barlow Condensed","Arial Narrow";font-size:19px;font-weight:700;flex:1;line-height:1.15}
.ltitle b{background:#0008;border-radius:6px;padding:0 7px;color:#fff}
.lbadge{font-size:13px;color:var(--sky);font-weight:700;white-space:nowrap}
.lmsg{font-size:12px;color:var(--amber);margin-top:6px}
.lmsg.calm{color:var(--green)}
.seatpill{font-size:12.5px;color:var(--muted);margin-top:6px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.seatpill button{color:var(--sky);font-weight:600;font-size:12.5px;padding:6px 0;white-space:nowrap}

/* views */
.view{display:none;padding:4px 16px 16px}
.view.on{display:block;animation:fade .2s}
@keyframes fade{from{opacity:0;transform:translateY(4px)}}
.sec{font-size:12.5px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:700;margin:18px 0 10px}

/* home */
.hero{padding:6px 0 2px}
.hero p{color:var(--muted);font-size:14.5px;line-height:1.5;margin:6px 0 0}
.evcard{display:block;width:100%;text-align:left;border-radius:18px;overflow:hidden;margin-bottom:12px;border:1px solid var(--line);background:var(--panel);transition:transform .1s}
.evcard:active{transform:scale(.985)}
.evtop{height:92px;padding:12px 14px;display:flex;justify-content:space-between;align-items:flex-start;position:relative;overflow:hidden}
.evtop .em{font-size:46px;position:absolute;right:14px;bottom:-4px;filter:drop-shadow(0 4px 10px #0006)}
.evbot{padding:12px 14px 14px}
.evbot .t{font-family:"Barlow Condensed","Arial Narrow";font-size:22px;font-weight:700;text-transform:uppercase;line-height:1.1}
.evbot .s{font-size:13px;color:var(--muted);margin-top:3px}
.livetag{display:inline-flex;align-items:center;gap:6px;background:#000a;border-radius:99px;padding:4px 10px;font-size:11.5px;font-weight:700}
.livetag i{width:7px;height:7px;border-radius:50%;background:var(--red)}
.addcard{width:100%;border:1.5px dashed #36597a;border-radius:18px;padding:18px;text-align:left;color:var(--muted);font-size:14px;line-height:1.5}
.addcard b{color:var(--text);font-size:16px;display:block;margin-bottom:2px}

/* map */
.mapwrap{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:8px}
svg.map{width:100%;display:block;touch-action:manipulation}
.zone{fill:#1c3247;stroke:#2e4c68;stroke-width:1.5;cursor:pointer;transition:fill .2s}
.zone.sel{fill:#2a5577}
.zlbl{fill:#a9c2d6;font:700 12px "Barlow Condensed","Arial Narrow";letter-spacing:1.5px;pointer-events:none;text-transform:uppercase}
.pin{cursor:pointer}
.pin circle{stroke:#0b1622;stroke-width:2}
.pin text{font:700 10px Inter,sans-serif;fill:#0b1622;pointer-events:none}
.pin.soon circle{opacity:.45}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:11.5px;color:var(--muted);margin:10px 4px 2px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}

/* chips & search */
.search{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px 12px;margin-top:6px}
.search input{flex:1;background:none;border:0;color:var(--text);outline:none;padding:9px 0;min-width:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:8px 14px;font-size:13px;font-weight:500;color:var(--muted);flex:none}
.chip.on{background:var(--sky);border-color:var(--sky);color:#04202f;font-weight:700}

/* cards */
.card{display:flex;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px;text-align:left;width:100%;align-items:center;transition:transform .1s}
.card:active{transform:scale(.985)}
.ico{width:52px;height:52px;border-radius:12px;display:grid;place-items:center;font-size:26px;flex:none}
.card .t{font-weight:700;font-size:15px}
.card .s{font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.35}
.meta{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:#0b1622;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.g{color:var(--green);border-color:#2a6b50}
.tag.a{color:var(--amber);border-color:#6b5524}
.tag.r{color:var(--red);border-color:#6b2a2a}
.tag.b{color:var(--sky);border-color:#235b78}
.chev{color:var(--muted);font-size:20px}
.nearest{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 4px}
.nearest::-webkit-scrollbar{display:none}
.near{flex:none;width:150px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left}
.near .ico{width:40px;height:40px;font-size:20px;border-radius:10px;margin-bottom:8px}
.near .t{font-weight:700;font-size:13.5px}
.near .s{font-size:11.5px;color:var(--muted);margin-top:3px}

/* sheet */
.scrim{position:fixed;inset:0;background:#000a;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,105%);width:100%;max-width:480px;max-height:90%;overflow:auto;overscroll-behavior:contain;background:var(--bg);border-radius:22px 22px 0 0;z-index:50;transition:transform .28s cubic-bezier(.2,.8,.2,1);border-top:1px solid var(--line);padding-bottom:var(--sab)}
.sheet:not(.on){visibility:hidden;transition:transform .28s cubic-bezier(.2,.8,.2,1),visibility 0s .28s}
.sheet.on{transform:translate(-50%,0)}
.grab{position:sticky;top:0;z-index:2;background:var(--bg);padding:10px 0 6px;touch-action:none}
.grab div{width:40px;height:5px;border-radius:4px;background:#3a536a;margin:0 auto}
.shead{padding:4px 18px 14px;display:flex;gap:14px;align-items:center}
.shead .ico{width:64px;height:64px;font-size:32px}
.shead h2{font-size:26px;font-weight:700;line-height:1.05}
.sbody{padding:0 18px 40px}
.locbox{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.item .n{font-weight:600;font-size:14.5px}
.item .d{font-size:12px;color:var(--muted);margin-top:2px}
.item .p{font-weight:700;margin-left:auto;white-space:nowrap}
.add{width:40px;height:40px;border-radius:12px;background:var(--sky);color:#04202f;font-weight:800;font-size:22px;flex:none}
.add:disabled{background:#2a3d50;color:#5b7389;cursor:not-allowed}
.qty{display:flex;align-items:center;gap:6px;flex:none}
.qty button{width:36px;height:36px;border-radius:10px;background:var(--panel2);font-weight:800;font-size:18px}
.qty span{min-width:18px;text-align:center;font-weight:700}
.note{font-size:12px;color:var(--muted);line-height:1.5;background:#0f1d2a;border:1px dashed var(--line);border-radius:10px;padding:10px 12px;margin-top:14px}
.x{position:absolute;right:14px;top:12px;width:36px;height:36px;border-radius:50%;background:var(--panel);font-size:16px;color:var(--muted);z-index:3}

/* fab + nav */
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + var(--sab));width:calc(100% - 32px);max-width:448px;background:var(--sky);color:#04202f;border-radius:14px;padding:15px 16px;font-weight:700;display:none;justify-content:space-between;align-items:center;z-index:30;box-shadow:0 10px 30px #5bc2f040}
.fab.on{display:flex}
.fab .c{background:#04202f;color:var(--sky);border-radius:8px;padding:2px 8px;margin-right:8px}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#0a141ef2;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:none;z-index:35;padding:6px 6px calc(8px + var(--sab))}
.nav.on{display:flex}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11px;font-weight:600;color:var(--muted);position:relative;min-height:50px}
.nav button.on{color:var(--sky)}
.nav svg{width:24px;height:24px}
.badge{position:absolute;top:0;right:calc(50% - 22px);background:var(--red);color:#fff;font-size:10px;font-weight:700;border-radius:99px;padding:1px 6px}

/* basket */
.opt{display:flex;gap:10px;align-items:flex-start;background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:13px 12px;margin-bottom:8px;width:100%;text-align:left}
.opt.on{border-color:var(--sky);background:#11293b}
.opt:disabled{opacity:.45}
.opt .rad{width:18px;height:18px;border-radius:50%;border:2px solid var(--muted);flex:none;margin-top:2px}
.opt.on .rad{border-color:var(--sky);background:radial-gradient(var(--sky) 45%,transparent 50%)}
.opt b{display:block;font-size:14px}
.opt small{color:var(--muted);font-size:12px;line-height:1.4}
.row{display:flex;gap:8px}
.field{flex:1;display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--muted);font-weight:600;min-width:0}
.field input,.field select{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px;outline:none;width:100%}
.field select option{background:var(--panel2)}
.tot{display:flex;justify-content:space-between;font-size:14px;padding:6px 0;color:var(--muted)}
.tot.big{font-size:18px;color:var(--text);font-weight:700;border-top:1px solid var(--line);padding-top:12px;margin-top:6px}
.cta{width:100%;background:var(--sky);color:#04202f;font-weight:800;padding:15px;border-radius:14px;margin-top:14px;font-family:"Barlow Condensed","Arial Narrow";letter-spacing:.5px;text-transform:uppercase;font-size:19px}
.cta:disabled{background:#2a3d50;color:#5b7389}
.ghost{width:100%;border:1px solid var(--line);border-radius:12px;padding:13px;margin-top:8px;color:var(--muted);font-weight:600}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--muted);margin-top:12px;line-height:1.45}
.check input{margin-top:2px;accent-color:var(--sky);width:18px;height:18px;flex:none}
.empty{text-align:center;color:var(--muted);padding:44px 20px;line-height:1.5}
.empty .big{font-size:48px;margin-bottom:10px}

/* orders */
.ord{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.ord .h{display:flex;justify-content:space-between;align-items:center}
.code{font-family:"Barlow Condensed","Arial Narrow";font-size:36px;font-weight:800;color:var(--sky);letter-spacing:3px;line-height:1}
.steps{display:flex;gap:4px;margin:12px 0 8px}
.steps div{flex:1;height:5px;border-radius:4px;background:#2a3d50}
.steps div.done{background:var(--green)}
.steps div.cur{background:linear-gradient(90deg,var(--green),#2a3d50);background-size:200% 100%;animation:load 1.2s linear infinite}
@keyframes load{from{background-position:100% 0}to{background-position:-100% 0}}
.stlbl{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted)}
.status{font-weight:700;font-size:15px;margin-top:8px}
.ord ul{margin:10px 0 0;padding:0;list-style:none;font-size:13px;color:var(--muted)}
.ord li{padding:2px 0;display:flex;justify-content:space-between}

.toast{position:fixed;top:calc(14px + var(--sat));left:50%;transform:translate(-50%,-300%);background:var(--green);color:#04202f;font-weight:700;padding:12px 18px;border-radius:12px;z-index:60;transition:transform .3s;font-size:14px;width:max-content;max-width:90%;text-align:center;box-shadow:0 8px 24px #0006}
.toast.on{transform:translate(-50%,0)}
.disclaimer{font-size:11px;color:#5f7a90;text-align:center;padding:14px 10px 0;line-height:1.5}
.disclaimer a{color:var(--sky)}
</style>
</head>

function copyCode(c,btn){try{navigator.clipboard.writeText(c).then(()=>{btn.textContent="Copied ✓"},()=>{btn.textContent=c})}catch(e){btn.textContent=c}}

let carT=null,carHold=0;
function startCarousel(){
  const c=S("car");if(!c)return;clearInterval(carT);
  const step=()=>c.children[0].offsetWidth+10, idx=()=>Math.round(c.scrollLeft/step());
  const mark=()=>{const i=idx();[...S("dots").children].forEach((d,j)=>d.classList.toggle("on",i===j));const el=c.children[i];if(el)imp(el.dataset.ad)};
  c.onscroll=()=>{clearTimeout(c._t);c._t=setTimeout(mark,120)};
  c.onpointerdown=()=>{carHold=Date.now()};
  mark();
  carT=setInterval(()=>{if(!document.body.contains(c)||view!=="home"){clearInterval(carT);return}
    if(Date.now()-carHold<8000)return;const n=(idx()+1)%c.children.length;c.scrollTo({left:n*step(),behavior:"smooth"})},5000);
}

let locs={}; try{locs=JSON.parse(localStorage.getItem("cc_locs"))||{}}catch(e){}
const EV=()=>EVENTS[evId];
const shops=()=>EV().shops;
const shopById=(id,e=EV())=>e.shops.find(s=>s.id===id);
const zoneById=(id,e=EV())=>e.zones.find(z=>z.id===id);
const loc=()=>locs[evId]||null;
const saveLocs=()=>{try{localStorage.setItem("cc_locs",JSON.stringify(locs))}catch(e){}};
const zoneName=s=>{const z=zoneById(s.zone);return z?z.name:s.zone};
const waitFor=s=>{if(s.soon||s.info)return null;const base={food:7,bar:5,sweet:3,shop:3}[s.cat]||5;const c=EV().clock(T);return Math.max(1,Math.round(base*(c.rush?2.6:1)+((s.id.charCodeAt(0)+T)%4)-1))};
const waitTag=s=>{const w=waitFor(s);if(w==null)return"";const c=w<=5?"g":w<=10?"a":"r";return `<span class="tag ${c}">⏱ ~${w} min</span>`};

/* ================= MAP ================= */
function renderMap(){
  const e=EV(); S("map").setAttribute("viewBox",e.viewBox);
  let h=e.base;
  e.zones.filter(z=>z.d).forEach(z=>{
    h+=`<path class="zone ${zoneF===z.id?"sel":""}" ${z.evenodd?'fill-rule="evenodd"':""} d="${z.d}" onclick="pickZone('${z.id}')"/>`;
  });
  h+=e.overlay;
  e.zones.filter(z=>z.d).forEach(z=>{h+=`<text class="zlbl" x="${z.lx}" y="${z.ly}" text-anchor="middle" ${z.rot?`transform="rotate(${z.rot} ${z.lx} ${z.ly})"`:""}>${z.name}</text>`});
  e.shops.forEach((s,i)=>{
    if(cat!=="all"&&s.cat!==cat)return;
    h+=`<g class="pin ${s.soon?"soon":""}" onclick="openShop('${s.id}')"><circle cx="${s.x}" cy="${s.y}" r="11" fill="${CATS[s.cat].color}"/><text x="${s.x}" y="${s.y+3.5}" text-anchor="middle">${i+1}</text></g>`;
  });
  const p=youXY();
  if(p) h+=`<g pointer-events="none"><circle cx="${p[0]}" cy="${p[1]}" r="12" fill="#fff3"><animate attributeName="r" values="8;16;8" dur="2s" repeatCount="indefinite"/></circle><circle cx="${p[0]}" cy="${p[1]}" r="6" fill="#fff"/><text x="${p[0]}" y="${p[1]-11}" text-anchor="middle" fill="#fff" font-size="9" font-weight="700" font-family="Inter">YOU</text></g>`;
  S("map").innerHTML=h;
  S("mapAd").innerHTML=adHTML(rotating(adsFor(e.type)),true);
  const used=[...new Set(e.shops.map(s=>s.cat))];
  S("legend").innerHTML=used.map(k=>`<span><i style="background:${CATS[k].color}"></i>${CATS[k].label}</span>`).join("")+(e.shops.some(s=>s.soon)?`<span><i style="background:#8fa6ba;opacity:.45"></i>Coming soon</span>`:"")+`<span style="width:100%">Tap an area to filter, or a pin to open it.</span>`;
  const list=e.shops.filter(s=>zoneF==="all"||s.zone===zoneF);
  S("zoneHead").textContent=zoneF==="all"?"Everything here":zoneById(zoneF).name;
  S("zoneList").innerHTML=(zoneF!=="all"?`<button class="chip on" style="margin-bottom:10px" onclick="pickZone('all')">✕ ${zoneById(zoneF).name} — show all</button>`:"")+list.map(cardHTML).join("");
  const open=e.shops.filter(s=>!s.soon&&!s.info);
  const near=p?[...open].sort((a,b)=>Math.hypot(a.x-p[0],a.y-p[1])-Math.hypot(b.x-p[0],b.y-p[1])).slice(0,6):[...open].sort((a,b)=>waitFor(a)-waitFor(b)).slice(0,6);
  S("nearHead").textContent=p?"Nearest to you":"Shortest queues";
  S("nearest").innerHTML=near.map(s=>{const walk=p?Math.max(1,Math.round(Math.hypot(s.x-p[0],s.y-p[1])/55)):null;
    return `<button class="near" onclick="openShop('${s.id}')"><div class="ico" style="background:${s.bg}">${s.emoji}</div><div class="t">${s.name}</div><div class="s">${walk?`🚶 ${walk} min · `:""}⏱ ~${waitFor(s)} min</div></button>`}).join("");
}
function youXY(){const l=loc();if(!l)return null;const z=zoneById(l.zone);if(!z||!z.cx)return null;
  if(EV().type==="stadium"&&l.block){const n=(parseInt(l.block)||5)%10/10;return{North:[90+n*220,78],South:[90+n*220,425],West:[68,140+n*220],East:[332,140+n*220]}[l.zone]||[z.cx,z.cy]}
  return [z.cx,z.cy]}
function pickZone(k){zoneF=zoneF===k?"all":k;renderMap();if(zoneF!=="all")S("zoneHead").scrollIntoView({behavior:"smooth",block:"start"})}

/* ================= SHOPS ================= */
function cardHTML(s){
  const i=shops().indexOf(s)+1;
  const st=s.soon?`<span class="tag">Coming soon</span>`:s.info?`<span class="tag g">${s.hours||"Info"}</span>`:`<span class="tag b">Order ahead</span>`;
  return `<button class="card" onclick="openShop('${s.id}')"><div class="ico" style="background:${s.bg}">${s.emoji}</div>
    <div style="flex:1;min-width:0"><div class="t">${s.name}</div><div class="s">${s.desc}</div>
    <div class="meta"><span class="tag">#${i} · ${zoneName(s)}</span>${st}${waitTag(s)}${s.adult?'<span class="tag r">18+</span>':""}</div></div><span class="chev">›</span></button>`;
}
function renderChips(){
  const e=EV(), used=[...new Set(e.shops.map(s=>s.cat))];
  S("catChips").innerHTML=[["all","All","✨"],...used.map(k=>[k,CATS[k].label,CATS[k].emoji])].map(([k,l,em])=>`<button class="chip ${cat===k?"on":""}" onclick="cat='${k}';renderChips();renderShops()">${em} ${l}</button>`).join("");
  S("zoneChips").innerHTML=[["all","Everywhere"],...e.zones.map(z=>[z.id,z.name])].map(([k,l])=>`<button class="chip ${zoneF===k?"on":""}" onclick="zoneF='${k}';renderChips();renderShops()">${l}</button>`).join("");
}
function renderShops(){
  const q=S("q").value.trim().toLowerCase();
  const txt=s=>(s.name+" "+s.desc+" "+CATS[s.cat].label+" "+(s.menu||[]).flatMap(g=>g.items.map(i=>i.n+" "+i.d+" "+(i.tags||[]).map(t=>({V:"vegetarian",VG:"vegan vegetarian",GF:"gluten free"})[t]).join(" "))).join(" ")).toLowerCase();
  const list=shops().filter(s=>(cat==="all"||s.cat===cat)&&(zoneF==="all"||s.zone===zoneF)&&(!q||txt(s).includes(q)));
  const a=list.filter(s=>!s.soon&&!s.info),b=list.filter(s=>s.info),c=list.filter(s=>s.soon);
  let h="";
  if(a.length){const cards=a.map(cardHTML);
    if(!q){const pr=EV().promos||[];if(pr.length&&cards.length>1)cards.splice(2,0,promoHTML(rotating(pr)));
      if(cards.length>5)cards.splice(6,0,`<div style="margin-bottom:10px">${adHTML(rotating(adsFor(EV().type),1))}</div>`);
      if(pr.length>1&&cards.length>9)cards.splice(10,0,promoHTML(rotating(pr,1)));}
    h+=`<div class="sec">Order ahead · ${a.length}</div>`+cards.join("");}

  if(c.length)h+=`<div class="sec">Coming soon</div>`+c.map(cardHTML).join("");
  S("shopList").innerHTML=h||`<div class="empty"><div class="big">🤷</div>Nothing matches that — try another search.</div>`;

    <div class="sbody"><p style="color:var(--muted);margin:0 0 12px;font-size:14px;line-height:1.5">${s.desc}</p>
    <div class="locbox">📍<div><b>${zoneName(s)}</b><br><span style="color:var(--muted)">Pin #${i} on the map${s.hours?" · "+s.hours:""}</span></div>
    <button class="chip" style="margin-left:auto" onclick="closeSheet();zoneF='${zoneById(s.zone)?.d?s.zone:"all"}';go('map')">Show on map</button></div>`;
  (s.menu||[]).forEach(g=>{
    h+=`<div class="sec">${g.group}</div>`;
    g.items.forEach((it,ix)=>{
      const key=`${s.id}|${g.group}|${ix}`,inB=basket.find(b=>b.key===key);
      const tags=(it.tags||[]).map(t=>`<span class="tag g">${t}</span>`).join("")+(it.adult?'<span class="tag r">18+</span>':"");
      h+=`<div class="item"><div style="flex:1;min-width:0"><div class="n">${it.n}</div><div class="d">${it.d}${tags?` <span class="meta" style="display:inline-flex;margin:0">${tags}</span>`:""}</div></div>
        <div class="p">${gbp(it.p)}</div>
        ${inB?`<div class="qty"><button onclick="chg('${key}',-1,'${id}')">−</button><span>${inB.q}</span><button onclick="chg('${key}',1,'${id}')">+</button></div>`
             :`<button class="add" ${canOrder?"":"disabled"} aria-label="Add ${it.n}" onclick="addItem('${s.id}','${esc(g.group)}',${ix})">+</button>`}</div>`;
    });
  });
  h+=`<div class="note">${s.soon?"🚧 Coming soon — menu is a preview; ordering opens when it does.":s.info?"ℹ️ No ordering needed here — just turn up.":"🧾 Sample prices for this prototype. Ask staff for allergen info. V = vegetarian · VG = vegan · GF = gluten free."}</div></div>`;
  openSheet(h);
}

/* ================= BASKET ================= */
function addItem(sid,group,ix){
  const s=shopById(sid),it=s.menu.find(g=>g.group===group).items[ix];
  if(basket.length&&basket[0].sid!==sid){
    openSheet(`<div class="sbody" style="padding-top:10px"><h2 style="font-size:26px">Start a new basket?</h2>
      <p style="color:var(--muted);font-size:14px;line-height:1.5">Your basket has items from <b>${shopById(basket[0].sid).name}</b>. Each order is collected from one place.</p>
      <button class="cta" onclick="basket=[];addItem('${sid}','${esc(group)}',${ix})">Clear & add</button><button class="ghost" onclick="openShop('${sid}')">Keep current basket</button></div>`);
    return;
  }
  basket.push({key:`${sid}|${group}|${ix}`,sid,n:it.n,p:it.p,q:1,adult:!!it.adult});
  buzz();toast(`Added ${it.n}`);updateBadges();openShop(sid);
}
function chg(key,d,reopen){const b=basket.find(x=>x.key===key);if(!b)return;b.q+=d;if(b.q<=0)basket=basket.filter(x=>x!==b);updateBadges();reopen?openShop(reopen):renderBasket()}
function updateBadges(){
  const n=basket.reduce((a,b)=>a+b.q,0),t=basket.reduce((a,b)=>a+b.q*b.p,0);
  S("bB").style.display=n?"":"none";S("bB").textContent=n;S("fabN").textContent=n;S("fabT").textContent=gbp(t);
  S("fab").classList.toggle("on",!!evId&&n>0&&view!=="basket");
  const live=orders.filter(o=>o.ev===evId&&o.stage<3).length;S("oB").style.display=live?"":"none";S("oB").textContent=live;
}
function canDeliver(){const e=EV();if(!e.delivery)return false;const l=loc();if(l&&zoneById(l.zone)?.standing)return false;return true}
function renderBasket(){
  const e=EV();
  if(!basket.length){S("basketBody").innerHTML=`<div class="empty"><div class="big">🛒</div><b>Your basket is empty</b><br><br>Pick a stall on the map or browse shops to order without missing a thing.<br><br><button class="cta" onclick="go('shops')">Browse</button></div>`;return}
  const s=shopById(basket[0].sid),sub=basket.reduce((a,b)=>a+b.q*b.p,0);
  if(fulfil==="seat"&&!canDeliver())fulfil="collect";
  const slots=e.slots(T);if(!slots.find(x=>x.id===when))when="asap";
  const fee=fulfil==="seat"?1.5:0,adult=basket.some(b=>b.adult),l=loc();
  const seatOk=fulfil!=="seat"||(l&&l.block&&l.row&&l.num);
  let h=`<div class="sec">Ordering from</div><button class="card" onclick="openShop('${s.id}')"><div class="ico" style="background:${s.bg}">${s.emoji}</div><div style="flex:1"><div class="t">${s.name}</div><div class="s">${zoneName(s)}</div></div><span class="chev">›</span></button>`;
  h+=basket.map(b=>`<div class="item"><div style="flex:1;min-width:0"><div class="n">${b.n}</div><div class="d">${gbp(b.p)} each</div></div><div class="qty"><button onclick="chg('${b.key}',-1)">−</button><span>${b.q}</span><button onclick="chg('${b.key}',1)">+</button></div><div class="p" style="min-width:58px;text-align:right">${gbp(b.p*b.q)}</div></div>`).join("");
  h+=`<div class="sec">How do you want it?</div>
    <button class="opt ${fulfil==="collect"?"on":""}" onclick="fulfil='collect';renderBasket()"><span class="rad"></span><span><b>🏃 Collect it</b><small>Skip the queue — show your code at the fast-track point</small></span></button>`;
  if(e.delivery){
    const ok=canDeliver();
    h+=`<button class="opt ${fulfil==="seat"?"on":""}" ${ok?"":"disabled"} onclick="fulfil='seat';renderBasket()"><span class="rad"></span><span><b>💺 Bring it to my seat</b><small>${ok?`Delivered to your row · £1.50${adult?' · <span style="color:var(--amber)">ID checked on delivery</span>':""}`:"Not available in standing areas"}</small></span></button>`;
    if(fulfil==="seat"){
      const seatZones=e.zones.filter(z=>z.d&&!z.standing&&!z.noSeat);
      h+=`<div class="row" style="margin:6px 0 4px"><label class="field">${e.zoneWord}<select id="fZ" onchange="seatInline()">${seatZones.map(z=>`<option value="${z.id}" ${l&&l.zone===z.id?"selected":""}>${z.name}</option>`).join("")}</select></label>
        <label class="field">Block<input id="fBl" inputmode="numeric" value="${l?.block||""}" placeholder="14" oninput="seatInline()"></label></div>
        <div class="row" style="margin-bottom:6px"><label class="field">Row<input id="fRo" value="${l?.row||""}" placeholder="K" oninput="seatInline()"></label>
        <label class="field">Seat<input id="fSe" inputmode="numeric" value="${l?.num||""}" placeholder="112" oninput="seatInline()"></label></div>`;
    }
  }
  h+=`<div class="sec">When?</div>`+slots.map(x=>`<button class="opt ${when===x.id?"on":""}" onclick="when='${x.id}';renderBasket()"><span class="rad"></span><span><b>${x.label}</b><small>${x.id==="asap"?`Ready in about ${waitFor(s)} min — we'll notify you`:x.sub}</small></span></button>`).join("");
  h+=`<div style="margin-top:14px"><div class="tot"><span>Subtotal</span><span>${gbp(sub)}</span></div>${fee?`<div class="tot"><span>Seat delivery</span><span>${gbp(fee)}</span></div>`:""}<div class="tot big"><span>Total</span><span>${gbp(sub+fee)}</span></div></div>`;
  if(adult)h+=`<label class="check"><input type="checkbox" ${ageOK?"checked":""} onchange="ageOK=this.checked;renderBasket()"> I'm 18 or over and understand ID may be checked (Challenge 25).</label>`;
  h+=`<button class="cta" id="payBtn" ${(adult&&!ageOK)||!seatOk?"disabled":""} onclick="pay()">💳 Pay ${gbp(sub+fee)}</button>
      <p style="text-align:center;font-size:11.5px;color:var(--muted);margin:8px 0 0">${e.pay} · Apple Pay / Google Pay (simulated)</p>`;

let actx=null;
document.addEventListener("pointerdown",()=>{try{if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();actx.resume()}catch(e){}},{passive:true});
function chime(kind){
  if(!actx)return;
  try{const notes=kind==="ready"?[784,1047,1319]:[523,659];const t0=actx.currentTime;
    notes.forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.type="sine";o.frequency.value=f;const t=t0+i*.13;
      g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.22,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.4);
      o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+.45)})}catch(e){}
}

}

function clearDemo(){orders=[];try{localStorage.removeItem("cc_orders")}catch(e){}bcSend({});refreshOrdersUI();kToast("Demo orders cleared")}
orders=loadOrders().map(o=>({...o,isNew:false}));
if(MODE==="kitchen"){evId="cbs";document.title="Concourse Kitchen – Staff Screen"}
